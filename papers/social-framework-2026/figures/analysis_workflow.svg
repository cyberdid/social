   <g id="text_1">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(24.494625 33.050025)">IncidentSpec + budgets</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(16.130812 42.812775)">Optional collection execution</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(155.382188 33.712087)">Fixed Source Watch</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(143.118 42.770025)">Capture → bridge → ledger</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(278.400937 33.014025)">Pretyped local inputs</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(278.609625 42.812775)">Explicit files + cutoff</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(25.860375 76.007025)">Structural report gates</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(30.98475 85.7304)">References / hashes</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(23.454563 95.4504)">Cutoffs / frozen controls</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(149.607563 76.007025)">Offline analytical stages</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(135.856125 85.7304)">Retrieve / organize / summarize</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(146.122875 95.4504)">Unknowns remain explicit</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(279.917437 76.0104)">Report input bundle</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(276.1065 85.7304)">Findings / assessments</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(281.547 95.4504)">Separately supplied</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(65.274187 132.975)">Demonstrated boundary: scripted / integrated bounded workflow (levels 1–2)</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(70.665188 142.695)">No independent end-to-end incident benchmark (levels 3–4 unestablished)</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(52.34175 152.37225)">Passing structural gates does not validate retrieval entailment or physical event truth</text>
   </g>
