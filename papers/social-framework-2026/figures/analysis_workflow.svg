   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(19.841625 32.521837)">IncidentSpec + budgets</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(8.467172 44.671837)">Optional collection execution</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(155.018672 33.393712)">Fixed Source Watch</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(139.060547 44.671837)">Capture → bridge → ledger</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(276.808219 32.521837)">Pretyped local inputs</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(277.582359 44.671837)">Explicit files + cutoff</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(22.507875 74.263837)">Structural report gates</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(28.573734 86.932041)">References / hashes</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(20.098969 99.082041)">Cutoffs / frozen controls</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(144.768516 74.263837)">Offline analytical stages</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(127.171406 86.413837)">Retrieve / organize / summarize</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(140.95125 98.563837)">Unknowns remain explicit</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(279.347906 74.263837)">Report input bundle</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(272.223141 86.413837)">Findings / assessments</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(279.377437 98.563837)">Separately supplied</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(24.948984 131.228437)">Demonstrated boundary: scripted / integrated bounded workflow (levels 1–2)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(30.105 143.378437)">No independent end-to-end incident benchmark (levels 3–4 unestablished)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263844" transform="translate(5.76 155.528437)">Passing structural gates does not validate retrieval entailment or physical event truth</text>
   </g>
