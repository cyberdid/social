   </g>
   <g id="text_3">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(298.244813 33.552832)">Passage</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(283.942125 43.35552)">Текст / локатор</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(28.665563 98.62992)">Твердження / згадка</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(24.803438 108.306607)">Формулювання + обсяг</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(29.609438 118.06992)">Твердження ≠ подія</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(162.525375 98.784607)">Оцінка доказів</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(137.779313 108.306607)">Відношення + обґрунтування</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(148.078125 118.026607)">Походження прийняття</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(277.000875 98.550607)">Результат перевірки</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(274.592813 108.796545)">Обсяг + межа + стан</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(272.541938 118.066545)">«Невідомо» і конфлікт</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(54.428062 167.04144)">Сім'ї залежних джерел</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(40.626562 176.628127)">Копії можуть мати один корінь</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(35.480812 186.42744)">Невідомий зв'язок ≠ незалежність</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(229.75875 166.98744)">Оцінка / висновок, що заміщує</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(209.165625 176.74344)">Запис лишається; посилання перевіряються</text>
    <text style="font-size: 7.2px; font-family: 'CMU Serif'; fill: #263844" transform="translate(204.822 186.424065)">Дійсний ID не встановлює фізичної істинності</text>
   </g>
